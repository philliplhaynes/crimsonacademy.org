# nginx config for the fly.io deployment.
#
# This file is the container equivalent of crimsonacademy-site/public/_redirects.
# That one line means nothing to nginx, so the same rule is expressed here as a
# try_files directive. If you take one thing from this file, it is the `location
# /` block: without it every deep link — /academics, /crimson-for-life, or just
# refreshing the page you are on — returns 404, because no file of that name
# exists on disk. The site is one index.html and a router.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints these filenames (index-D4xgoLjK.js), so the content at a
    # given URL can never change. Cache them for a year and skip revalidation
    # entirely. A new deploy produces new filenames, so nothing goes stale.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The News page video clips. NOT fingerprinted — img_4960.mp4 keeps its name
    # across deploys — so a shorter window, and no `immutable`. nginx serves
    # byte ranges by default, which is what lets a browser scrub a video without
    # downloading all of it.
    location /media/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # index.html must never be cached: it is the file that names the current
    # hashed assets. A stale copy points at asset filenames that no longer
    # exist, and the site loads blank until the visitor hard-refreshes.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # The SPA fallback. Try the literal file, then a directory, then hand back
    # index.html and let React Router read the path.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Text compresses well; images and video are already compressed, so
    # including them would burn CPU for nothing. WebP and MP4 are deliberately
    # absent from this list.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Fly terminates TLS at its edge and forwards over HTTP, so the client's
    # real address arrives in a header. Without this, logs show Fly's internal
    # proxy IP for every request.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;
}
